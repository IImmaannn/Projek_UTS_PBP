<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokoKu</title>
  <link rel="stylesheet" href="belanja2.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">TokoKu</div>
    <nav>
      <input type="text" placeholder="Cari produk...">
      <button>Cari</button>
    </nav>
    <div class="user-menu">
      <a href="#">Daftar</a>
      <a href="#">Masuk</a>
      <span class="cart">🛒</span>
    </div>
  </header>

  <!-- Banner Toko -->
  <section class="store-banner">
    <div class="store-info">
      <img src="https://via.placeholder.com/80" alt="Logo Toko">
      <div>
        <h2>Nama Toko Resmi</h2>
        <p>Aktif 5 menit lalu | Produk: 30 | Pengikut: 12rb</p>
      </div>
      <button class="follow">Ikuti</button>
      <button class="chat">Chat</button>
    </div>
  </section>

  <!-- Kategori -->
  <nav class="categories">
    <a href="#">Halaman Utama</a>
    <a href="#">Produk</a>
    <a href="#">Promo</a>
    <a href="#">Bundle</a>
  </nav>

  <!-- Produk -->
  <section class="products">
    <h3>Produk Kami</h3>
    <div class="product-list">
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Produk">
        <h4>Nama Produk 1</h4>
        <p class="price">Rp150.000</p>
        <button>Beli</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Produk">
        <h4>Nama Produk 2</h4>
        <p class="price">Rp200.000</p>
        <button>Beli</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Produk">
        <h4>Nama Produk 3</h4>
        <p class="price">Rp99.000</p>
        <button>Beli</button>
      </div>
    </div>
  </section>
</body>
</html>
