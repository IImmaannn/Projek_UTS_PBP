<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokoKita</title>
  <link rel="stylesheet" href="belanja4.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">TokoKita</h1>
    <nav>
      <a href="#">Beranda</a>
      <a href="#">Kategori</a>
      <a href="#">Promo</a>
      <a href="#">Keranjang</a>
      <a href="#">Akun</a>
    </nav>
  </header>

  <!-- Banner -->
  <section class="banner">
    <div class="banner-box">
      <h2>Promo Spesial!</h2>
      <p>Diskon hingga 50% untuk produk pilihan</p>
      <button>Belanja Sekarang</button>
    </div>
  </section>

  <!-- Kategori Produk -->
  <section class="kategori">
    <h3>Kategori Produk</h3>
    <div class="grid">
      <div class="item">
        <img src="img/elektronik.png" alt="Elektronik">
        <p>Elektronik</p>
      </div>
      <div class="item">
        <img src="img/fashion.png" alt="Fashion">
        <p>Fashion</p>
      </div>
      <div class="item">
        <img src="img/aksesoris.png" alt="Aksesoris">
        <p>Aksesoris</p>
      </div>
      <div class="item">
        <img src="img/kesehatan.png" alt="Kesehatan">
        <p>Kesehatan</p>
      </div>
    </div>
  </section>
</body>
</html>
