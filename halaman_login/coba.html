<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Login</title>
  <link rel="stylesheet" href="coba2.css">
</head>
<body>
  <div class="container">
    
    <!-- Bagian Sign Up -->
    <div class="signup">
      <h2>Selamat Datang!</h2>
      <p>Buat akunmu sekarang dan nikmati pengalaman belanja yang lebih mudah</p>
      <button class="btn-outline">DAFTAR</button>
    </div>

    <!-- Bagian Sign In -->
    <div class="signin">
      <h2>Masuk</h2>
      <p class="subtitle">Gunakan akun sosial atau email</p>
      <div class="social-icons">
        <a href="https://facebook.com">F</a>
        <a href="https://Google.com">G+</a>
        <a href="#">in</a>
      </div>
      <form>
        <input type="email" placeholder="Alamat Email" required>
        <input type="password" placeholder="Kata Sandi" required>
        <a href="#" class="forgot">Lupa kata sandi?</a>
        <button type="submit" class="btn">MASUK</button>
      </form>
    </div>

  </div>
</body>
</html>
